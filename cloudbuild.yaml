substitutions:
  _REGION: us-central1
  _SERVICE_NAME: gemini-decision-router
  _REPO_NAME: cloud-run-source-deploy
  _GEMINI_API_KEY_SECRET: gemini-api-key

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: "gcr.io/cloud-builders/docker"
    env:
      - "DOCKER_BUILDKIT=1"
    args:
      - "build"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${BUILD_ID}"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${BUILD_ID}"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "${_SERVICE_NAME}"
      - "--image"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${BUILD_ID}"
      - "--region"
      - "${_REGION}"
      - "--set-secrets"
      - "GEMINI_API_KEY=${_GEMINI_API_KEY_SECRET}:latest"
      # GOOGLE_CLOUD_PROJECT enables trace correlation in structured JSON logs.
      # Once POST /v1beta/decisions supports Enterprise/Vertex, switch to:
      # GOOGLE_GENAI_USE_ENTERPRISE=true,GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=global
      - "--set-env-vars"
      - "GOOGLE_CLOUD_PROJECT=${PROJECT_ID}"
      - "--no-allow-unauthenticated"
      - "--quiet"

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${BUILD_ID}"
