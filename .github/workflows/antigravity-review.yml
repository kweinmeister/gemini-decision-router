# AI-powered first-pass PR review using the Antigravity SDK.
# Pinned to a specific commit rather than @main per the action's security recommendation: https://github.com/rsamborski/run-agy-sdk
name: "🔎 Antigravity PR Review"

on:
  pull_request:
    types: [opened, reopened]
  workflow_dispatch:

permissions: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}"
  cancel-in-progress: true

jobs:
  antigravity-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Antigravity PR Review
        uses: rsamborski/run-agy-sdk@0634f555fdf93cc230321689a9f0d85ccfdcc368 # main as of 2026-11-23
        id: agy_pr_review
        with:
          api-key: ${{ secrets.GEMINI_API_KEY || secrets.ANTIGRAVITY_API_KEY }}
          github-token: ${{ github.token }}
          mode: review
          prompt: /antigravity-review
          trust-workspace: "true"
          sandbox-profile: "true"
