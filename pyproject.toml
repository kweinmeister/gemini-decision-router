[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "gemini-decision-router"
version = "0.1.0"
description = """\
  Calibrated multimodal model & thinking-level router using the Gemini Decisions API (gemini-decision-1), plus \
  reproducible evals harness.\
  """
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [ { name = "Karl Weinmeister" } ]
requires-python = ">=3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  "google-genai>=3.2",
  "pillow>=10",
  "pydantic>=2.10",
  "pypdf>=5",
  "pypdfium2>=4.30",
]
optional-dependencies.dev = [
  "fastapi>=0.115",
  "matplotlib>=3.9",
  "numpy>=2",
  "pillow>=10",
  "pytest>=8.3",
  "pytest-cov>=6",
  "ruff>=0.8",
  "uvicorn[standard]>=0.32",
]
optional-dependencies.evals = [ "matplotlib>=3.9", "numpy>=2", "pillow>=10" ]
optional-dependencies.server = [ "fastapi>=0.115", "uvicorn[standard]>=0.32" ]
scripts.gdr = "gemini_decision_router.cli:main"

[dependency-groups]
dev = [
  "fastapi>=0.115",
  "matplotlib>=3.9",
  "numpy>=2",
  "pillow>=10",
  "pytest>=8.3",
  "pytest-cov>=6",
  "ruff>=0.8",
  "uvicorn[standard]>=0.32",
]

[tool.hatch]
build.targets.wheel.packages = [ "src/gemini_decision_router" ]

[tool.ruff]
target-version = "py314"
line-length = 100
lint.select = [ "B", "E", "F", "I", "UP" ]
lint.ignore = [ "E501" ]

[tool.pyrefly]
python-version = "3.14"
project-includes = [ "evals", "src", "tests" ]
search-path = [ "src", "." ]

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.pythonpath = [ "src", "." ]
ini_options.addopts = "--cov=gemini_decision_router --cov-report=term-missing --durations=10"
ini_options.markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
ini_options.filterwarnings = [
  'ignore:"\\/" is an invalid escape sequence:SyntaxWarning',
  "ignore:builtin type SwigPy.* has no __module__ attribute:DeprecationWarning",
  "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]
